<style>
:root {
  --bg: #F8F7F3; --rail: #F1EFE9; --surface: #FFFFFF; --raised: #FFFFFF; --sunken: #ECE9E2; --field: #FFFFFF;
  --hover: rgba(28,24,16,.055); --active: rgba(28,24,16,.09);
  --ink: #16140F; --ink-2: #57524A; --ink-3: #6E685E; --line: rgba(28,24,16,.09); --line-2: rgba(28,24,16,.17);
  --gold: #F2B04A; --gold-ink: #1A1205; --accent: #8A5603; --accent-soft: rgba(242,176,74,.22); --accent-line: rgba(190,125,20,.65);
  --mark-a: #E9A23B; --mark-b: #D9891F; --halo: #F2B04A;
  --good: #23704B; --good-soft: rgba(35,112,75,.12); --warn: #7F5307; --bad: #A33A2A;
  --add-bg: #E6F3EA; --add-ink: #1F5A3D; --del-bg: #FBE9E5; --del-ink: #8C2F20;
  --user: #2F6B8F; --feedback: #7A4E9B; --project: #B26D0C; --reference: #3F7A5C; --none: #8A847A;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --r: 12px; --r-s: 9px;
  --shadow: 0 1px 2px rgba(28,24,16,.04);
  --shadow-up: 0 16px 40px -12px rgba(28,24,16,.28), 0 2px 8px rgba(28,24,16,.08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0B0A09; --rail: #100F0D; --surface: #171614; --raised: #211F1B; --sunken: #050504; --field: rgba(255,255,255,.07);
    --hover: rgba(255,255,255,.06); --active: rgba(255,255,255,.105);
    --ink: #F1EFEA; --ink-2: #AFAAA1; --ink-3: #8F8A81; --line: rgba(255,255,255,.075); --line-2: rgba(255,255,255,.15);
    --accent: #FFD977; --accent-soft: rgba(242,176,74,.15); --accent-line: rgba(255,217,119,.6);
    --mark-a: #FFD977; --mark-b: #F2B04A; --halo: #FFD977;
    --good: #7CC4A0; --good-soft: rgba(124,196,160,.13); --warn: #E7B75F; --bad: #EE8F7E;
    --add-bg: #14291B; --add-ink: #93D9B0; --del-bg: #331712; --del-ink: #F2A698;
    --user: #8EC2E4; --feedback: #C9A9E6; --project: #F2B04A; --reference: #8CCBA9; --none: #9A948A;
    --shadow: none;
    --shadow-up: 0 20px 48px -12px rgba(0,0,0,.7), 0 2px 8px rgba(0,0,0,.4);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.55 var(--sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
h1, h2, h3 { margin: 0; font-weight: 600; }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--accent); text-underline-offset: 2px; }
::selection { background: var(--accent-soft); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }
*::-webkit-scrollbar { width: 11px; height: 11px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb { background: var(--line-2); background-clip: content-box; border: 3px solid transparent; border-radius: 10px; }
.i { flex: none; display: block; }
.grow { flex: 1; min-width: 0; }
.mark { flex: none; display: block; overflow: visible; }
.sg-a { stop-color: var(--mark-a); } .sg-b { stop-color: var(--mark-b); } .sg-h { stop-color: var(--halo); }
.shell { display: grid; grid-template-columns: 224px minmax(0, 1fr); height: 100vh; }

.rail { display: flex; flex-direction: column; gap: 1px; padding: 16px 10px 10px; border-right: 1px solid var(--line); background: var(--rail); }
.brand { display: flex; align-items: center; gap: 9px; padding: 0 8px 16px; font-size: 14px; font-weight: 600; letter-spacing: -.012em; }
.nav { display: flex; align-items: center; gap: 9px; width: 100%; height: 32px; padding: 0 9px; border: 0; border-radius: var(--r-s); background: none; color: var(--ink-2); cursor: pointer; text-align: left; font-size: 13.5px; font-weight: 500; }
.nav:hover { background: var(--hover); color: var(--ink); }
.nav[aria-current="page"] { background: var(--active); color: var(--ink); }
.nav[aria-current="page"] .i { color: var(--accent); }
.nav .count { margin-left: auto; }
.count { min-width: 20px; padding: 0 6px; border-radius: 10px; background: var(--gold); color: var(--gold-ink); font-size: 11px; line-height: 18px; font-weight: 650; text-align: center; font-variant-numeric: tabular-nums; }
.count.quiet { background: var(--active); color: var(--ink-2); }
.rail-foot { margin-top: auto; padding: 10px; border-radius: var(--r-s); font-size: 12px; line-height: 1.5; color: var(--ink-2); }
.foot-line { display: flex; align-items: center; gap: 7px; }
.foot-sub { color: var(--ink-3); padding-left: 14px; }
.dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px var(--good-soft); }
.dot.off { background: var(--ink-3); box-shadow: none; } .dot.bad { background: var(--bad); box-shadow: none; }

main { min-width: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
main:focus { outline: none; }
html[data-shell="mac"] .rail { padding-top: 46px; }
html[data-shell="mac"] main { padding-top: 38px; }
.page { flex: 1; overflow-y: auto; padding: 28px clamp(20px, 5vw, 56px) 64px; }
.page-inner { max-width: 800px; margin: 0 auto; }
.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
.page-head h1 { font-size: 24px; line-height: 1.2; letter-spacing: -.022em; }
.sub { margin: 4px 0 0; color: var(--ink-2); font-size: 13.5px; }
.muted-note { margin: 16px 2px 0; color: var(--ink-3); font-size: 12.5px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border: 0; border-radius: var(--r-s); background: var(--active); cursor: pointer; white-space: nowrap; font-size: 13px; font-weight: 550; }
.btn:hover { background: var(--line-2); }
.btn.primary { background: var(--gold); color: var(--gold-ink); font-weight: 620; }
.btn.primary:hover { background: #F7BE63; }
.btn.ghost { background: none; color: var(--ink-2); }
.btn.ghost:hover { background: var(--hover); color: var(--ink); }
.btn.sm { height: 26px; padding: 0 8px; font-size: 12.5px; border-radius: 7px; }
.btn.square { width: 34px; height: 34px; padding: 0; }
.btn.large { width: 100%; height: 42px; font-size: 14.5px; border-radius: 11px; }
.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.input, textarea.input, select.input { width: 100%; padding: 8px 11px; border: 1px solid var(--line-2); border-radius: var(--r-s); background: var(--field); outline: none; }
.input:focus { border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea.input { font: 13px/1.65 var(--mono); resize: vertical; min-height: 280px; }
label.field { display: block; margin-bottom: 14px; color: var(--ink-2); font-size: 12.5px; font-weight: 550; }
label.field .input { margin-top: 5px; color: var(--ink); font-weight: 400; font-size: 14px; }
.search { position: relative; flex: 1; min-width: 0; }
.search .i { position: absolute; left: 10px; top: 9px; color: var(--ink-3); pointer-events: none; }
.search .input { height: 34px; padding-left: 31px; border-color: transparent; background: var(--active); }
.search .input:focus { background: var(--field); border-color: var(--accent-line); }
.search input::-webkit-search-cancel-button { -webkit-appearance: none; }

.split { flex: 1; display: grid; grid-template-columns: minmax(280px, 332px) minmax(0, 1fr); min-height: 0; }
.list-pane { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
.list-tools { padding: 14px 12px 10px; display: grid; gap: 10px; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.chip { height: 25px; padding: 0 10px; border: 0; border-radius: 13px; background: var(--hover); color: var(--ink-2); font-size: 12px; font-weight: 500; cursor: pointer; }
.chip:hover { background: var(--active); color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.notes { flex: 1; overflow-y: auto; padding: 0 8px 16px; list-style: none; margin: 0; }
.notes li { margin-bottom: 1px; }
.note-row { display: block; width: 100%; padding: 9px 11px 10px; border: 0; border-radius: 10px; background: none; text-align: left; cursor: pointer; }
.note-row:hover { background: var(--hover); }
.note-row[aria-current="true"] { background: var(--active); }
.note-row b { display: block; font-size: 13.5px; font-weight: 600; letter-spacing: -.005em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.note-row span.d { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; margin-top: 1px; color: var(--ink-2); font-size: 12.5px; line-height: 1.42; }
.note-row .m { display: flex; gap: 10px; margin-top: 5px; color: var(--ink-3); font-size: 11.5px; }
.stale { color: var(--warn); font-weight: 550; }
.tag { display: inline-flex; align-items: center; gap: 6px; }
.tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c, var(--none)); }
.t-user { --c: var(--user); } .t-feedback { --c: var(--feedback); } .t-project { --c: var(--project); } .t-reference { --c: var(--reference); }
.reader { overflow-y: auto; padding: 30px clamp(20px, 5vw, 56px) 72px; min-width: 0; }
.reader-inner { max-width: 690px; margin: 0 auto; }
.reader h1.title { font-size: 26px; line-height: 1.22; letter-spacing: -.024em; overflow-wrap: anywhere; }
.reader-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.lede { margin: 7px 0 14px; color: var(--ink-2); font-size: 15px; line-height: 1.5; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 18px; margin-bottom: 22px; border-bottom: 1px solid var(--line); }
.meta > span { display: inline-flex; align-items: center; height: 23px; padding: 0 8px; border-radius: 7px; background: var(--hover); color: var(--ink-2); font-size: 12px; }
.meta > span.path { font: 11.5px var(--mono); color: var(--ink-3); }
.warn-box { display: flex; gap: 10px; padding: 11px 13px; margin-bottom: 18px; border: 1px solid var(--accent-line); border-radius: var(--r-s); background: var(--accent-soft); font-size: 13px; line-height: 1.45; }
.warn-box .i { color: var(--accent); margin-top: 1px; }

.md { overflow-wrap: anywhere; font-size: 14.5px; line-height: 1.66; }
.md h1, .md h2, .md h3 { margin: 24px 0 8px; font-weight: 620; letter-spacing: -.012em; }
.md h1 { font-size: 18px; } .md h2 { font-size: 16px; } .md h3 { font-size: 14.5px; }
.md > :first-child { margin-top: 0; }
.md p { margin: 0 0 11px; } .md ul, .md ol { margin: 0 0 11px; padding-left: 20px; } .md li { margin: 3px 0; }
.md li::marker { color: var(--ink-3); }
.md code { padding: 1.5px 5px; border-radius: 5px; background: var(--active); font: 12.5px var(--mono); }
.md pre { padding: 13px 14px; overflow-x: auto; border-radius: var(--r-s); background: var(--sunken); border: 1px solid var(--line); } .md pre code { padding: 0; background: none; }
.md blockquote { margin: 0 0 11px; padding-left: 13px; border-left: 2px solid var(--line-2); color: var(--ink-2); }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 20px 0; }
.table-wrap { overflow-x: auto; margin: 0 0 14px; border: 1px solid var(--line); border-radius: var(--r-s); }
.md table { width: 100%; border-collapse: collapse; font-size: 13px; line-height: 1.5; }
.md th, .md td { padding: 7px 11px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.md tr:last-child td { border-bottom: 0; }
.md th { font-weight: 600; background: var(--hover); }
.wikilink { padding: 0; border: 0; background: none; color: var(--accent); cursor: pointer; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; font: inherit; }
.wikilink.missing { color: var(--ink-3); text-decoration-style: dashed; cursor: default; }
.section-label { margin: 30px 0 9px; color: var(--ink-2); font-size: 12.5px; font-weight: 600; }
.linklist { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px; }
.linklist button { padding: 9px 12px 10px; border: 0; border-radius: 10px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); text-align: left; cursor: pointer; font-size: 13px; font-weight: 600; }
.linklist button:hover:not(:disabled) { background: var(--raised); box-shadow: inset 0 0 0 1px var(--line-2); }
.linklist button:disabled { cursor: default; color: var(--ink-3); }
.linklist small { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; margin-top: 1px; color: var(--ink-2); font-size: 12px; font-weight: 400; line-height: 1.4; }

.day { margin: 24px 2px 8px; color: var(--ink-2); font-size: 12.5px; font-weight: 600; }
.day:first-of-type { margin-top: 0; }
.change { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; column-gap: 11px; align-items: start; padding: 12px 12px 12px 14px; margin-bottom: 7px; border-radius: var(--r); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line), var(--shadow); }
.change.is-new { box-shadow: inset 0 0 0 1px var(--accent-line), var(--shadow); }
.change-icon { color: var(--accent); padding-top: 2px; }
.change-title { font-size: 13.5px; font-weight: 600; letter-spacing: -.005em; overflow-wrap: anywhere; }
.new-tag { margin-left: 8px; color: var(--accent); font-size: 11.5px; font-weight: 650; }
.change-meta { margin-top: 1px; color: var(--ink-3); font-size: 12.5px; }
.files { margin: 7px 0 0; padding: 0; list-style: none; }
.files li { font-size: 13px; }
.file-line { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 24px; }
.file-btn { min-width: 0; padding: 0; border: 0; background: none; color: var(--ink-2); cursor: pointer; text-align: left; font: 12px var(--mono); overflow-wrap: anywhere; }
.file-btn:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
.diff { margin: 5px 0 8px; padding: 9px 0; overflow-x: auto; border-radius: var(--r-s); background: var(--sunken); border: 1px solid var(--line); font: 12px/1.6 var(--mono); }
.diff div { padding: 0 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.diff .a { background: var(--add-bg); color: var(--add-ink); } .diff .d { background: var(--del-bg); color: var(--del-ink); } .diff .h { color: var(--ink-3); }

.card { padding: 15px 16px; margin-bottom: 9px; border-radius: var(--r); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line), var(--shadow); }
.card h2 { font-size: 14px; letter-spacing: -.005em; }
.card p { margin: 2px 0 0; color: var(--ink-2); font-size: 13px; line-height: 1.5; }
.card-head { display: flex; align-items: flex-start; gap: 12px; }
.tile { flex: none; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); }
.tile.plain { background: var(--active); color: var(--ink-2); }
.meter { height: 6px; margin-top: 12px; border-radius: 3px; background: var(--active); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--mark-b), var(--mark-a)); } .meter i.near { background: var(--warn); } .meter i.over { background: var(--bad); }
.issue-list { margin: 10px 0 0 44px; padding: 0; list-style: none; font-size: 13px; }
.issue-list li { padding: 3px 0; color: var(--ink-2); overflow-wrap: anywhere; }
.path-line { display: flex; align-items: center; gap: 7px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--ink-3); font: 12px var(--mono); overflow-wrap: anywhere; }
.group { margin-bottom: 9px; border-radius: var(--r); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line), var(--shadow); }
.tool { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-bottom: 1px solid var(--line); }
.tool:last-child { border-bottom: 0; }
.tool b { font-size: 13.5px; font-weight: 600; } .tool small { display: block; color: var(--ink-3); font-size: 12.5px; }
.state-good { display: inline-flex; align-items: center; gap: 4px; color: var(--good); font-weight: 550; }

.graph-head { padding: 28px clamp(20px, 4vw, 40px) 8px; }
.graph-head .page-head { margin-bottom: 0; align-items: center; }
.graph-wrap { flex: 1; min-height: 0; position: relative; }
.graph-wrap svg.graph { width: 100%; height: 100%; display: block; }
.graph-wrap line { stroke: var(--line-2); stroke-width: 1; transition: opacity .12s ease; }
.node { cursor: pointer; transition: opacity .12s ease; outline: none; }
.node .dot-c { stroke: var(--bg); stroke-width: 2; }
.node:hover .dot-c, .node:focus-visible .dot-c { stroke: var(--ink); }
.node text { fill: var(--ink-2); font-size: 11px; font-weight: 500; pointer-events: none; opacity: 0; paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round; }
.node.labelled text { opacity: 1; }
svg.focus .node:not(.on) { opacity: .2; }
svg.focus line:not(.on) { opacity: .1; }
svg.focus line.on { stroke: var(--accent); }
svg.focus .node.on text { opacity: 1; fill: var(--ink); }
.caption { position: absolute; left: 24px; bottom: 20px; max-width: 440px; padding: 10px 13px; border-radius: var(--r); background: var(--raised); box-shadow: inset 0 0 0 1px var(--line-2), var(--shadow-up); font-size: 13px; }
.caption b { font-weight: 600; }
.caption small { display: block; color: var(--ink-2); font-size: 12.5px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--ink-2); font-size: 12px; }

.talk { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.talk-log { flex: 1; overflow-y: auto; padding: 28px clamp(20px, 5vw, 56px) 16px; }
.talk-inner { max-width: 700px; margin: 0 auto; }
.msg { margin-bottom: 16px; }
.msg.user { display: flex; justify-content: flex-end; }
.msg.user .bubble { max-width: 80%; padding: 8px 13px; border-radius: 14px; background: var(--active); white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14.5px; }
.step { display: flex; align-items: center; gap: 10px; min-height: 42px; padding: 8px 12px; margin-bottom: 7px; border-radius: 10px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font-size: 13px; font-weight: 550; }
.step .i { color: var(--accent); }
.step.running { color: var(--ink-2); font-weight: 500; }
.composer { padding: 8px clamp(20px, 5vw, 56px) 18px; }
.composer-box { max-width: 700px; margin: 0 auto; padding: 10px 10px 8px 14px; border-radius: 16px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-2), var(--shadow-up); }
.composer-box:focus-within { box-shadow: inset 0 0 0 1px var(--accent-line), var(--shadow-up); }
.composer-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }
.composer textarea { width: 100%; min-height: 24px; max-height: 160px; padding: 3px 0; border: 0; background: none; outline: none; font: 14.5px/1.5 var(--sans); resize: none; }
.composer textarea::placeholder { color: var(--ink-3); }
.send { display: grid; place-items: center; width: 30px; height: 30px; border: 0; border-radius: 50%; background: var(--gold); color: var(--gold-ink); cursor: pointer; }
.send:hover:not(:disabled) { background: #F7BE63; }
.send:disabled { background: var(--active); color: var(--ink-3); cursor: default; }
.composer-foot { display: flex; align-items: center; gap: 6px; margin-top: 4px; color: var(--ink-3); font-size: 12px; }
.composer-foot select { padding: 1px 2px; border: 0; background: none; color: var(--ink-2); font-size: 12px; font-weight: 550; cursor: pointer; }
.suggestions { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 16px; }
.suggestions .chip { height: 30px; padding: 0 13px; border-radius: 15px; font-size: 13px; }

.empty { padding: 56px 16px; color: var(--ink-2); text-align: center; font-size: 13.5px; }
.empty h2 { margin-bottom: 4px; font-size: 17px; letter-spacing: -.012em; color: var(--ink); }
.empty p { margin: 0 0 16px; }
.empty .glyph { display: grid; place-items: center; width: 56px; height: 56px; margin: 0 auto 14px; }
.empty .tile { width: 44px; height: 44px; border-radius: 13px; margin: 0 auto 14px; }
.sk { display: block; height: 11px; border-radius: 5px; background: var(--active); }
.sk-row { padding: 12px 11px; display: grid; gap: 7px; }
